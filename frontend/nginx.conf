server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ECG uploads are two small files; refuse anything larger at the edge.
  client_max_body_size 6m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # Same origin for the browser: cookies never leave this host and CORS is not involved.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: unknown paths fall back to index.html (client-side routing).
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-store";
  }
}
